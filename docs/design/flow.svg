<text x="1016" y="510" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">I-6 diff_anomaly → 2 名</text>
<text x="1016" y="530" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">I-7 signed+乖離 → CRITICAL</text>
