<text x="704" y="250" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">due_at = 判断日 + deadlines[level]</text>
<text x="704" y="270" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">divergence 非空 → exception 不可</text>
<text x="704" y="290" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">diff_anomaly → 承認 2 名以上</text>
<text x="704" y="310" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">decision は空のまま（自動判断しない）</text>
