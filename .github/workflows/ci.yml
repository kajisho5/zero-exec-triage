# Unit tests and the Zero-Exec check (strace). External Actions are pinned to a commit SHA.
# Uses the runner's own Python (3.12 on ubuntu-24.04; 3.11 or later is required) and adds no further Actions.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: strace (required for the Zero-Exec check)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq strace
      - name: python version (3.11 or later)
        run: python3 -I -c 'import sys; print(sys.version); assert sys.version_info >= (3, 11)'
      - name: tests
        # shell: bash runs with -eo pipefail (tee does not hide a test failure)
        shell: bash
        run: |
          tests/run-tests.sh | tee "$RUNNER_TEMP/out.txt"
          # a SKIP because strace is unavailable does not count as a pass
          ! grep -q '^SKIP' "$RUNNER_TEMP/out.txt"
