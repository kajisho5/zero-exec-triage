# If there is no tag vX.Y.Z for the first version in CHANGELOG.md on main ("## X.Y.Z — YYYY-MM-DD"),
# create the tag and a GitHub Release. The release notes are that version's section of CHANGELOG. No external Actions (gh is standard on the runner).
name: release
on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the version and release notes from CHANGELOG
        id: ver
        run: |
          line="$(grep -m1 -E '^## [0-9]+\.[0-9]+\.[0-9]+ ' CHANGELOG.md || true)"
          ver="$(printf '%s' "$line" | sed -E 's/^## ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          if [ -z "$ver" ]; then echo "CHANGELOG has no version heading"; exit 1; fi
          # from the line after that version's heading up to the next "## " heading
          awk -v v="$ver" 'BEGIN{p=0} /^## /{ if (p) exit; if (index($0, "## " v " ")==1) {p=1; next} } p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - name: Create the tag and the Release (nothing if they exist)
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          if gh release view "v$VER" >/dev/null 2>&1; then echo "v$VER already exists"; exit 0; fi
          gh release create "v$VER" --target "$GITHUB_SHA" --title "v$VER" --notes-file "$RUNNER_TEMP/notes.md"
